name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run typecheck
    - name: Check generated validator registry
      run: node scripts/generate-validators-index.js --check
    - run: npm run lint
    - run: npm run build
    - run: npm run test:coverage
    - name: Worker dry-run build
      run: cd worker && npm ci && npm run check
