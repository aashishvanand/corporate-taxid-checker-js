name: Release and Publish

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build package
      run: npm run build

    - name: Run tests
      run: npm test

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build package
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Check if version already published
      id: check-version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        NPM_VERSION=$(npm view corporate-taxid-checker-js version 2>/dev/null || echo "0.0.0")
        echo "package-version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "npm-version=$NPM_VERSION" >> $GITHUB_OUTPUT
        if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
          echo "should-publish=true" >> $GITHUB_OUTPUT
        else
          echo "should-publish=false" >> $GITHUB_OUTPUT
        fi

    - name: Publish to NPM
      if: steps.check-version.outputs.should-publish == 'true'
      run: npm publish --provenance --access public

    - name: Create GitHub Release
      if: steps.check-version.outputs.should-publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.check-version.outputs.package-version }}"
        NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md)
        gh release create "v$VERSION" \
          --title "Release v$VERSION" \
          --notes "${NOTES:-Release v$VERSION}"

    - name: Skip publish (version unchanged)
      if: steps.check-version.outputs.should-publish == 'false'
      run: |
        echo "Version ${{ steps.check-version.outputs.package-version }} is already published on NPM"
        echo "Skipping publish step"
